<title>Loading</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fdf8f2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spinner-wrap {
    position: relative;
    width: 170px;
    height: 170px;
  }
  .ring-track { position: absolute; inset: 0; }
  .ring-fill  { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring-fill circle {
    fill: none;
    stroke: #c97b2a;
    stroke-width: 11;
    stroke-linecap: round;
    stroke-dasharray: 471;
    stroke-dashoffset: 471;
    animation: fill-up 2.2s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes fill-up {
    0%   { stroke-dashoffset: 471; opacity: 1; }
    75%  { stroke-dashoffset: 0;   opacity: 1; }
    90%  { stroke-dashoffset: 0;   opacity: 0; }
    100% { stroke-dashoffset: 471; opacity: 0; }
  }
  .spinner-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1);    opacity: 1; }
    50%      { transform: scale(.88); opacity: .65; }
  }
</style>
</head>
