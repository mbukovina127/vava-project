<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Shipinn</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="topbar">Login</div>

  <main>
    <div class="card">

      <div class="logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 13l14-7 14 7v14l-14 7L6 27V13z" stroke="#1E1E1E" stroke-width="1.8" stroke-linejoin="round" fill="none"/>
          <path d="M20 6v28M6 13l14 7 14-7" stroke="#1E1E1E" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M13 9.5l14 7" stroke="#1E1E1E" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M4 10 Q2 7 5 6 Q4 9 7 9" fill="#1E1E1E" opacity=".55"/>
          <path d="M3 10 Q1 6 4 5 Q3 8 6 8" fill="#1E1E1E" opacity=".3"/>
        </svg>
        <span class="logo-name">Shipinn</span>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Value" autocomplete="email"/>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Value" autocomplete="current-password"/>
      </div>

      <button class="btn" onclick="handleLogin()">Log in</button>

      <p class="bottom-link">
        Don't have an account? <a href="register.html">Register here</a>
      </p>

    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    function handleLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showToast('Please fill in all fields.'); return;
      }

      // TODO: replace with real API call
      showToast('Logging in…');
      // window.location.href = 'dashboard.html';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }
  </script>

</body>
</html>
