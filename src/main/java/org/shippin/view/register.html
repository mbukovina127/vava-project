<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Shipinn</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="topbar">Register</div>

  <main>
    <div class="card">

      <div class="logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 13l14-7 14 7v14l-14 7L6 27V13z" stroke="#1E1E1E" stroke-width="1.8" stroke-linejoin="round" fill="none"/>
          <path d="M20 6v28M6 13l14 7 14-7" stroke="#1E1E1E" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M13 9.5l14 7" stroke="#1E1E1E" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M4 10 Q2 7 5 6 Q4 9 7 9" fill="#1E1E1E" opacity=".55"/>
          <path d="M3 10 Q1 6 4 5 Q3 8 6 8" fill="#1E1E1E" opacity=".3"/>
        </svg>
        <span class="logo-name">Shipinn</span>
      </div>

      <div class="row">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Value" autocomplete="given-name"/>
        </div>
        <div>
          <label for="surname">Surname</label>
          <input type="text" id="surname" placeholder="Value" autocomplete="family-name"/>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Value" autocomplete="email"/>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Value"/>
      </div>

      <div class="form-group">
        <label for="confirm">Repeat Password</label>
        <input type="password" id="confirm" placeholder="Value"/>
      </div>

      <button class="btn" onclick="handleRegister()">Sign up as user</button>

      <p class="bottom-link">
        Already have an account? <a href="login.html">Log in here</a>
      </p>

    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    function handleRegister() {
      const name     = document.getElementById('name').value.trim();
      const surname  = document.getElementById('surname').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;

      if (!name || !surname || !email || !password || !confirm) {
        showToast('Please fill in all fields.'); return;
      }
      if (!/\S+@\S+\.\S+/.test(email)) {
        showToast('Please enter a valid email.'); return;
      }
      if (password.length < 6) {
        showToast('Password must be at least 6 characters.'); return;
      }
      if (password !== confirm) {
        showToast('Passwords do not match.'); return;
      }

      // TODO: replace with real API call
      showToast('Account created! Redirecting…');
      setTimeout(() => window.location.href = 'login.html', 2000);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleRegister();
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }
  </script>

</body>
</html>
