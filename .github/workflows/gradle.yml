name: Gradle Test CI

# Trigger workflow on push or pull request to main, develop, or feature branches
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    # Matrix allows running on multiple OS simultaneously
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Step 3: Run Gradle tests
      - name: Run tests
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            gradlew.bat test
          else
            ./gradlew test
          fi